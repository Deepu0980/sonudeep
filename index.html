<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pankaj Bhardwaj | Join Free Telegram</title>
  <style>
    :root { --telegram: #229ed9; --dark: #102a43; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: var(--dark);
      background: linear-gradient(135deg, #e8f7ff, #f7fbff);
    }
    .card {
      width: min(100%, 430px);
      padding: 38px 26px;
      text-align: center;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 18px 50px rgba(16, 42, 67, .15);
    }
    .telegram-logo {
      width: 92px;
      height: 92px;
      margin: 0 auto 18px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--telegram);
      box-shadow: 0 10px 22px rgba(34, 158, 217, .3);
    }
    .telegram-logo svg { width: 55px; fill: white; }
    h1 { margin: 0 0 10px; font-size: 30px; }
    p { margin: 8px 0; color: #52606d; line-height: 1.5; }
    .timer {
      margin: 24px auto 18px;
      font-size: 20px;
      font-weight: 700;
      color: var(--telegram);
    }
    .join-button {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 999px;
      color: white;
      background: var(--telegram);
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      transition: transform .2s, background .2s;
    }
    .join-button:hover { transform: translateY(-2px); background: #168dcc; }
    .note { margin-top: 18px; font-size: 12px; color: #829ab1; }
  </style>
</head>
<body>
  <main class="card">
    <div class="telegram-logo" aria-label="Telegram logo">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21.6 3.2 18.4 20c-.24 1.19-.87 1.48-1.76.92l-4.84-3.57-2.34 2.25c-.26.26-.48.48-.99.48l.35-4.93 8.98-8.11c.39-.35-.09-.55-.61-.2L6.08 13.74 1.33 12.25c-1.03-.32-1.05-1.03.22-1.52L20.1 3.46c.87-.32 1.63.2 1.5-.26Z"/>
      </svg>
    </div>
    <h1>Pankaj Bhardwaj</h1>
    <p>Join Free Telegram Channel</p>
    <div class="timer" id="timer">10 सेकंड में Telegram खुलेगा...</div>
    <a class="join-button" id="joinLink" href="https://t.me/+Xl6QcJluS9w1YzM9" target="_blank" rel="noopener noreferrer">Join Free Telegram</a>
    <div class="note">अगर redirect न हो, तो ऊपर दिए गए button पर click करें।</div>
  </main>

  <script>
    const telegramLink = 'https://t.me/+Xl6QcJluS9w1YzM9';
    const joinLink = document.getElementById('joinLink');
    const timer = document.getElementById('timer');
    joinLink.href = telegramLink;

    let seconds = 10;
    const countdown = setInterval(() => {
      seconds -= 1;
      timer.textContent = seconds > 0
        ? `${seconds} सेकंड में Telegram खुलेगा...`
        : 'Telegram खोला जा रहा है...';
      if (seconds <= 0) {
        clearInterval(countdown);
        window.location.href = telegramLink;
      }
    }, 1000);
  </script>
</body>
</html>
